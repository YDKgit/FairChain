<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairChain 관제 대시보드</title>
<link rel="stylesheet" href="/css/console.css">
</head>
<body>

<section id="loginView" class="login">
  <h2>FairChain 관제 대시보드</h2>
  <p class="hint">운영자 계정으로 로그인하면 고객사 공연별 대기 인원 · 차단된 매크로 · 남은 좌석이 1초마다 갱신됩니다.</p>
  <form id="loginForm">
    <input id="loginId" placeholder="운영자 아이디" required>
    <input id="password" type="password" placeholder="비밀번호" required>
    <button>로그인</button>
  </form>
  <p id="loginError" class="error"></p>
</section>

<div id="app" class="hidden">
  <header>
    <h1>FairChain 관제 대시보드</h1>
    <span class="client">고객사 <b id="clientId"></b> · 1초마다 갱신</span>
    <span class="spacer"></span>
    <a class="plain" href="/inspector.html">점검 화면</a>
    <button id="logout" class="plain">로그아웃</button>
  </header>
  <main>
    <p id="error" class="error"></p>
    <div class="card">
      <h2>공연별 지표 (SD-605)</h2>
      <table>
        <thead><tr><th>공연 ID</th><th class="num">대기 인원</th><th class="num">차단된 매크로</th><th class="num">남은 좌석</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="hint">아직 지표가 없습니다</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/console.js"></script>
<script>
  // SD-605: 로그인 → 대시보드 토큰으로 SSE 구독
  const { $, bindLogin, session } = FairChainConsole;
  let source = null;

  function start(clientId, token) {
    $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
    $('clientId').textContent = clientId || '';
    source = new EventSource('/dashboard/subscribe?token=' + encodeURIComponent(token));
    source.addEventListener('metrics', (e) => {
      const rows = JSON.parse(e.data).map((m) =>
        `<tr><td>${m.eventId}</td><td class="num">${m.waitingCount}</td><td class="num">${m.blockedCount}</td><td class="num">${m.remainingSlots}</td></tr>`);
      $('rows').innerHTML = rows.join('') || '<tr><td colspan="4" class="hint">등록된 공연이 없습니다</td></tr>';
      $('error').textContent = '';
    });
    source.onerror = () => { $('error').textContent = '연결이 끊겼습니다. 토큰이 만료되었으면 다시 로그인하세요'; };
  }

  $('logout').addEventListener('click', () => {
    session.clear(); source?.close();
    $('app').classList.add('hidden'); $('loginView').classList.remove('hidden');
  });

  bindLogin($('loginForm'), start);
</script>
</body>
</html>
