# FairChain 서버 — 비밀값은 환경변수 또는 application-local.yml(.gitignore)로
server:
  port: 8081

spring:
  profiles:
    default: local              # 프로필을 따로 안 주면 application-local.yml 사용 (없으면 무시)
  task:
    scheduling:
      pool:
        size: 4                 # 주기 작업(입장 허용 · 순번 전송 · 대시보드 · 블록 기록)이 서로를 막지 않게.
                                # 기본값 1이면 블록 기록이 노드 응답을 기다리는 동안 입장 허용도 멈춘다
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fairchain?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:fairchain}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false          # Redis는 StringRedisTemplate으로 직접 사용 (Repository 스캔 안 함)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

fairchain:
  queue:
    admit-per-second: 100       # 1초마다 입장 허용 인원 (SD-202-03)
    admission-ttl: 5m           # 입장 권한 유지 시간
  rate-limit:
    per-second: 5               # 회원 1명의 초당 요청 한도 (매크로 차단)
    idempotency-ttl: 10m
  scheduling:
    enabled: true
  nodes:
    # 처음에 아는 노드 (출발점). 그 뒤 목록은 노드에게 물어 맞춘다 — 노드가 추가 · 해지돼도 다시 켜지 않는다
    urls: http://localhost:9001,http://localhost:9002,http://localhost:9003
    api-key: ${NODE_API_KEY:}
    timeout: 2s
    refresh-ms: 3000            # 노드 목록을 다시 묻는 주기 (0이면 위 목록만 쓴다)
    # 점검 화면에서 노드를 추가 · 해지할 수 있는 운영자 로그인 ID (쉼표로 여럿). 비우면 seed 운영자만
    managers: ${NODE_MANAGERS:}
  block:
    process-interval-ms: 500    # 블록 기록 대기 줄 처리 주기
