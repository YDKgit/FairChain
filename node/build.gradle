plugins { id 'org.springframework.boot'; id 'io.spring.dependency-management' }

// microraft-store-sqlite 0.7은 jOOQ 3.16으로 만들어졌다. Spring Boot가 올리는 3.19와는 바이너리 호환이 보장되지 않아 맞춰 둔다
ext['jooq.version'] = '3.16.14'

dependencies {
 implementation project(':node-api')
 implementation project(':fairchain-api')
 implementation 'org.springframework.boot:spring-boot-starter-web'
 implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
 runtimeOnly 'com.h2database:h2'

 // Raft (리더 층 합의) — Apache-2.0, 고치지 않고 의존성으로만 쓴다 (NOTICE 참고)
 // microraft 0.7 POM이 Maven 플러그인을 compile 의존성으로 잘못 선언하고 있어 빼 둔다
 implementation('io.microraft:microraft:0.7') { exclude group: 'net.ju-n.maven.plugins' }
 implementation('io.microraft:microraft-store-sqlite:0.7') { exclude group: 'net.ju-n.maven.plugins' }

 testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
